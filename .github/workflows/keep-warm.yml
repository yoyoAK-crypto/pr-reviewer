# Render's free tier puts the service to sleep after ~15 minutes without traffic, and waking up
# takes longer than the 10 seconds GitHub waits for a webhook. Calling /health every 10 minutes
# keeps it awake. Set REVIEWER_URL in the repo's Settings > Secrets and variables > Actions > Variables.
# Delete this file if you move to a paid plan or a host that doesn't sleep.
name: Keep warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.REVIEWER_URL != '' }}
    steps:
      - run: curl -fsS --max-time 60 "${{ vars.REVIEWER_URL }}/health"